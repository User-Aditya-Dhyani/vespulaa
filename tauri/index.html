<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vespulaa Mesh (ADV-only)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <button class="btn" data-cmd="create_network">Create Network</button>
      <button class="btn" data-cmd="attach">Attach</button>
      <button class="btn" data-cmd="detach">Detach</button>
      <button class="btn warn" data-cmd="leave">Leave…</button>
      <button class="btn danger" data-cmd="purge">Purge (deep)</button>
      <button class="btn" data-cmd="config_local_client">Config Local Client</button>
    </div>
    <div class="right">
      <span>Scan(s)</span>
      <input id="scanSecs" value="15" size="3" class="in">
      <button class="btn" id="scanStart">Start</button>
      <button class="btn" id="scanStop">Stop</button>
      <button class="btn" id="scanToggle" title="Toggle scan panel">Scan Panel</button>
    </div>
  </header>

  <div id="boot-marker" style="position:fixed;bottom:8px;right:12px;font:12px/1.2 monospace;opacity:.6">
    HTML loaded… waiting for JS
  </div>

  <main class="grid">
    <!-- Main content column -->
    <section class="rightcol card">
      <nav id="logTabs">
        <button class="tab" data-tab="nodes">Nodes</button>
        <button class="tab" data-tab="devkey">DevKey</button>
        <button class="tab" data-tab="app">App</button>
      </nav>

      <div id="nodes-dash" class="nodes hidden">
        <div class="nodes-head">
          <div class="col name">Name</div>
          <div class="col uuid">UUID</div>
          <div class="col unicast">Unicast</div>
          <div class="col actions">Actions</div>
        </div>
        <div id="nodes-body" class="nodes-body"></div>
      </div>

      <pre id="log-devkey" class="log hidden"></pre>
      <pre id="log-app" class="log hidden"></pre>
      <div class="status" id="status">Status: idle</div>
    </section>

    <!-- Collapsible right-side scan panel column -->
    <aside id="scanAside" class="card">
      <h4>Unprovisioned (UUID | RSSI)</h4>
      <ul id="scanList" class="list compact"></ul>
      <div class="row" style="margin-top:8px;">
        <button class="btn" id="provSelected">Provision Selected</button>
        <span class="grow"></span>
        <label>UUID:</label>
        <input id="provUuid" size="36" class="in">
        <button class="btn" id="provUuidBtn">Provision UUID</button>
      </div>
    </aside>
  </main>

  <!-- Robust loader: try both known Tauri v2 script locations.
       main.js will wait/poll up to 5s for window.__TAURI__. -->
  <script>
    (function loadTauriShim(ready){
      function inject(src, cb){
        var s=document.createElement('script');
        s.src=src; s.onload=cb; s.onerror=cb;
        document.head.appendChild(s);
      }
      if (window.__TAURI__) return ready();
      inject("/.tauri/tauri.js", function(){
        if (window.__TAURI__) return ready();
        inject("tauri.js", ready);
      });
    })(function(){ /* shim attempted (ok if it 404s; app will poll) */ });
  </script>

  <!-- Your app (has its own bootstrap/polling) -->
  <script defer src="src/main.js"></script>
</body>
</html>
